
{% load static %}

<html>
<head>
    <title>My Django Blog</title>
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>

<body>
    <h1>My Django Blog</h1>

    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.text }}</p>
            <hr>
        </div>
    {% endfor %}

</body>
</html>
